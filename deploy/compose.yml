services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedlog
      POSTGRES_USER: feedlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedlog -d feedlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/leicanxi/feedlog:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - app-data:/app/.data
    environment:
      DATABASE_URL: postgresql://feedlog:${POSTGRES_PASSWORD}@db:5432/feedlog
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SYSTEM_ADMIN_EMAILS: ${SYSTEM_ADMIN_EMAILS}
      BETTER_AUTH_URL: https://wish.flowbee.top

volumes:
  db-data:
  app-data:
